name: Test

on:
  pull_request:
    branches:
      - '**'
      - '!main'
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read

jobs:
  test:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          GITHUB_REPOSITORY: zentered/issue-forms-body-parser-test

      - run: npm run build
        if: matrix.node == 24

      - name: Check action/ and pkg/ are up to date
        if: matrix.node == 24
        run: |
          if [ -n "$(git status --porcelain -- action pkg)" ]; then
            git status --short -- action pkg
            echo "action/ or pkg/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Read an issue content
        id: read_issue
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat ./test/test-issue-3.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Issue Forms Body Parser With Provided Body
        id: parse_with_body
        uses: ./
        with:
          body: ${{ steps.read_issue.outputs.body }}

      - name: Test input body parsed
        env:
          DATA: ${{ steps.parse_with_body.outputs.data }}
        run: |
          expected="Event Description"
          title=$(printf '%s' "$DATA" | jq -r '.["event-description"].title')
          if [[ "$title" != "$expected" ]]; then
            echo "Title \"${title}\" does not match \"${expected}\""
            exit 1
          fi
