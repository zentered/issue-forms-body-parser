name: Publish

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'

jobs:
  test:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      # Keep in sync with the publish job so the toolchain that runs the
      # tests is the one that builds and publishes the package.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm test
        env:
          GITHUB_REPOSITORY: zentered/issue-forms-body-parser-test
      - run: npm run release

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with a given
      # Node 24 runner image isn't guaranteed to meet that.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      # main is protected, so the release cannot push a build commit. Instead
      # action/ and pkg/ are committed in the PR and checked in test.yml. This
      # step stops a release if they are still stale, because the release tag
      # points at the main commit and the Action runs action/index.js from it.
      - run: npm run build
      - name: Check action/ and pkg/ are up to date
        run: |
          if [ -n "$(git status --porcelain -- action pkg)" ]; then
            git status --short -- action pkg
            echo "action/ or pkg/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
      - run: npx semantic-release
      - name: Move the major version tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          if [ -z "$tag" ]; then
            echo "No release on this commit, major tag unchanged."
            exit 0
          fi
          major="${tag%%.*}"
          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"
